name: Run BOT2 Hybrid Signal

on:
  schedule:
    # Berjalan otomatis setiap 10 menit
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy lightgbm scikit-learn joblib requests pytz websocket-client

      - name: Execute BOT2 Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_signal.py
