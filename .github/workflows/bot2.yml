name: Bot 2 Ultra Sniper (Auto-Train & Signal)

on:
  schedule:
    - cron: '*/5 * * * *' # Bot bakal jalan otomatis unggal 5 menit
  workflow_dispatch: # Supaya bisa dijalankeun manual iraha waé

jobs:
  run-bot-mastermind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Auto Train AI Bot 2
        run: |
          python train_ai_bot2.py

      - name: Execute Bot Signal Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_signal_bot2.py

      - name: Commit & Push Model/State Update
        run: |
          git config --global user.name "Bot2-Auto-Trainer"
          git config --global user.email "bot2@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Bot 2 AI Model and State" && git push)
