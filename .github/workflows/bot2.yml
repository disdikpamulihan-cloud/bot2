name: Bot 2 Ultra Sniper

on:
  schedule:
    - cron: '*/5 * * * *' # Bot bakal mariksa unggal 5 menit
  workflow_dispatch: # Supaya bisa dijalankeun manual lamun hayang

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Bot Signal Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_signal_bot2.py

      - name: Commit & Push Update (State/Model)
        run: |
          git config --global user.name "Bot-Auto-Commit"
          git config --global user.email "bot@github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update State Bot 2" && git push)
